name: Verify public KEMHarbor source alpha

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout the exact tested public revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check shell syntax and source-only release boundaries
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.sh; do
            bash -n "$file"
          done
          test ! -d tests
          test ! -e .env
          test ! -e secrets/mullvad_wg_private_key
          test ! -e .github/workflows/publish-private.yml
          git diff --check
      - name: Validate Compose configuration using placeholder values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secrets
          trap 'rm -f -- .env secrets/mullvad_wg_private_key' EXIT
          cp .env.example .env
          printf '%s\n' 'SYNTHETIC_NOT_A_PRIVATE_KEY' > secrets/mullvad_wg_private_key
          chmod 0400 secrets/mullvad_wg_private_key
          docker compose config --quiet
      - name: Build source image and verify signed upstream dependency
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag kemharbor:ci .
          docker run --rm --entrypoint /usr/bin/bash kemharbor:ci -c '
            set -euo pipefail
            for tool in wg wg-quick nft ip timeout curl jq; do
              command -v "$tool"
            done
            test -x /usr/local/sbin/mullvad-upgrade-tunnel
            test -x /usr/local/sbin/kemharbor-entrypoint
            test ! -e /usr/local/sbin/kernel-netns-test
          '
      - name: Reject absent runtime WireGuard secret for the expected reason
        shell: bash
        run: |
          set -euo pipefail
          # All format-valid values below are synthetic. No network interfaces
          # or nftables rules may be set up before the absent secret is rejected.
          log="$(mktemp)"
          trap 'rm -f -- "$log"' EXIT
          if docker run --rm --network none \
            --cap-drop=ALL \
            --env WG_ADDRESS=10.64.0.2/32 \
            --env VPN_ENDPOINT_IP=198.51.100.15 \
            --env VPN_ENDPOINT_PORT=51820 \
            --env VPN_PEER_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            kemharbor:ci >"$log" 2>&1; then
            echo 'SECURITY FAILURE: Image accepted a missing WireGuard key.' >&2
            exit 1
          fi
          if ! grep -Fxq 'ERROR: WireGuard key secret missing.' "$log"; then
            echo 'ERROR: Image failed for an unexpected reason, not the absent key.' >&2
            exit 1
          fi
          echo 'PASS: Missing secret rejected by expected pre-network VPN validation.'
